stages:
  - lint
  - build
  - deploy

variables:
  IMAGE_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA
  IMAGE_LATEST: $CI_REGISTRY_IMAGE:latest
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"

default:
  interruptible: true

lint:
  stage: lint
  image: node:20-alpine
  before_script:
    - corepack enable
    - pnpm install --frozen-lockfile
  script:
    - pnpm lint
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

docker_build_push:
  stage: build
  image: docker:27
  services:
    - name: docker:27-dind
      command: ["--tls=true"]
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
  script:
    - docker build --pull -t "$IMAGE_TAG" -t "$IMAGE_LATEST" .
    - docker push "$IMAGE_TAG"
    - docker push "$IMAGE_LATEST"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

deploy_production:
  stage: deploy
  image: alpine:3.20
  needs: ["docker_build_push"]
  before_script:
    - apk add --no-cache openssh-client rsync bash
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
  script:
    - rsync -az --delete --exclude '.git' ./ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"
    - |
      ssh "$DEPLOY_USER@$DEPLOY_HOST" \
      "cd '$DEPLOY_PATH' && \
       chmod +x deploy/scripts/blue_green_deploy.sh && \
       IMAGE='$IMAGE_TAG' \
       CI_REGISTRY='$CI_REGISTRY' \
       CI_REGISTRY_USER='$CI_REGISTRY_USER' \
       CI_REGISTRY_PASSWORD='$CI_REGISTRY_PASSWORD' \
       SERVER_NAME='${SERVER_NAME:-_}' \
       ./deploy/scripts/blue_green_deploy.sh"
  environment:
    name: production
    url: $PRODUCTION_URL
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
