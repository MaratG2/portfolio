services:
  proxy:
    image: nginx:1.27-alpine
    container_name: maratg2-proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/generated/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - maratg2_net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

networks:
  maratg2_net:
    external: true
    name: maratg2_net
