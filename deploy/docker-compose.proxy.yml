services:
  proxy:
    image: nginx:1.27-alpine
    container_name: ${PROXY_CONTAINER_NAME:-maratg2-proxy}
    restart: always
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/generated/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    networks:
      - app_net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

  certbot:
    image: certbot/certbot:latest
    container_name: ${CERTBOT_CONTAINER_NAME:-maratg2-certbot}
    profiles: ["tools"]
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    networks:
      - app_net

networks:
  app_net:
    external: true
    name: ${NETWORK_NAME:-maratg2_net}
