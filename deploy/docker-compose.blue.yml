services:
  app-blue:
    image: ${IMAGE:?IMAGE is required}
    container_name: ${BLUE_CONTAINER_NAME:-marat-frontend-blue}
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    networks:
      - maratg2_net
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const http=require('http');const req=http.get('http://127.0.0.1:3000/api/health',res=>process.exit(res.statusCode===200?0:1));req.on('error',()=>process.exit(1));",
        ]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s

networks:
  maratg2_net:
    external: true
    name: ${NETWORK_NAME:-desire_internal}
